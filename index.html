<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인생 로드맵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#14181f; --paper-raised:#1c212b; --paper-hover:#232936;
    --ink:#f1ede2; --ink-soft:#9a978c; --line:#333846;
    --accent:#ff5470; --accent-soft:rgba(255,84,112,0.15);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:"Inter",system-ui,sans-serif; }
  h1 { font-family:"Fraunces",serif; font-weight:500; font-size:21px; margin:0; }
  a { color: inherit; }
  #topbar { position:sticky; top:0; z-index:30; background:var(--paper); border-bottom:1px solid var(--line); }
  .banner { padding:6px 24px; font-size:11px; color:var(--ink-soft); border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  .banner button { font-size:11px; background:none; border:1px solid var(--line); color:var(--ink-soft); border-radius:6px; padding:2px 8px; cursor:pointer; }
  header { padding:14px 24px 12px; }
  .summary { display:flex; gap:16px; margin-top:8px; font-size:13px; color:var(--ink-soft); flex-wrap:wrap; align-items:center; }
  .summary b { color:var(--ink); font-weight:500; }
  .current-row { margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .chip { font-size:12px; border:1px solid #f5a623; color:#f5a623; background:rgba(245,166,35,0.12); border-radius:999px; padding:4px 10px; cursor:pointer; }
  .chip:hover { background:rgba(245,166,35,0.22); }
  #today-btn { font-size:12px; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink); border-radius:6px; padding:4px 10px; cursor:pointer; margin-left:auto; }
  #today-btn:hover { background:var(--paper-hover); }
  .layout { display:flex; }
  aside { width:190px; flex-shrink:0; border-right:1px solid var(--line); padding:16px; font-size:13px; align-self:flex-start; position:sticky; top:97px; }
  .section-title { font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-soft); margin:0 0 8px; }
  .section { margin-bottom:18px; }
  .row { display:flex; align-items:center; gap:8px; margin-bottom:6px; cursor:pointer; }
  .dot { width:8px; height:8px; border-radius:999px; flex-shrink:0; display:inline-block; }
  #search { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--paper-raised); color:var(--ink); font-size:13px; }
  .main { flex:1; min-width:0; }
  .lane-labels-wrap { display:flex; }
  .lane-labels { width:128px; flex-shrink:0; position:relative; border-right:1px solid var(--line); }
  .lane-label { position:absolute; width:100%; display:flex; flex-direction:column; justify-content:center; padding:4px 10px; font-size:12px; font-weight:500; }
  .lane-count { font-size:10px; color:var(--ink-soft); font-weight:400; }
  .timeline-scroll { flex:1; overflow-x:auto; position:relative; }
  .tick-row { position:sticky; top:0; height:26px; background:var(--paper); border-bottom:1px solid var(--line); z-index:2; }
  .tick { position:absolute; top:5px; font-size:11px; color:var(--ink-soft); transform:translateX(2px); }
  .today-label { position:absolute; top:5px; font-size:11px; color:var(--accent); font-weight:500; transform:translateX(4px); }
  .tbd-label { position:absolute; top:5px; font-size:11px; color:var(--ink-soft); }
  .canvas { position:relative; }
  .lane-bg { position:absolute; left:0; right:0; }
  .node { position:absolute; display:flex; flex-direction:column; justify-content:center; gap:2px; border:1px solid; border-radius:8px; padding:6px 8px; cursor:pointer; overflow:hidden; background-clip:padding-box; }
  .node:hover { filter:brightness(1.25); }
  .node.overdue { border-style:dashed; border-color:var(--accent) !important; }
  .node-status { display:flex; align-items:center; gap:5px; font-size:10px; color:var(--ink-soft); }
  .node-status.overdue-tag { color:var(--accent); }
  .node-title { font-size:12px; font-weight:500; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .hidden { display:none !important; }
  details { margin:20px 24px; }
  summary { cursor:pointer; font-size:13px; color:var(--ink-soft); padding:8px 0; }
  .pills { display:flex; flex-wrap:wrap; gap:6px; padding:10px 0 20px; }
  .pill { font-size:11px; border:1px solid; border-radius:999px; padding:4px 10px; text-decoration:none; background:var(--paper-raised); }
  .pill-date { opacity:0.6; margin-left:4px; }
  #loading, #error { padding:60px 24px; text-align:center; color:var(--ink-soft); }
  #error { color:var(--accent); }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal { width:420px; max-width:90vw; background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .modal h2 { font-size:17px; margin:0 0 4px; }
  .modal .meta { font-size:12px; color:var(--ink-soft); margin-bottom:14px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.4px; }
  .field select, .field input, .field textarea {
    width:100%; padding:8px; border:1px solid var(--line); border-radius:6px;
    background:var(--paper); color:var(--ink); font-family:inherit; font-size:13px;
  }
  .field textarea { min-height:80px; resize:vertical; }
  .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .btn { font-size:13px; padding:8px 14px; border-radius:6px; border:1px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn:hover { background:var(--paper-hover); }
  .modal-msg { font-size:12px; margin-top:8px; min-height:16px; }
  .modal-msg.ok { color:#4fd8b0; }
  .modal-msg.err { color:var(--accent); }
  .open-link { font-size:12px; color:#63b3ed; text-decoration:none; }
</style>
</head>
<body>
<div id="topbar">
  <div class="banner">
    <span>이 페이지는 열 때마다 노션에서 실시간으로 데이터를 읽어와요. 아무나 이 URL을 알면 보고 수정할 수 있어요.</span>
    <button id="settings-btn">Worker 설정</button>
  </div>
  <header>
    <h1>인생 로드맵</h1>
    <div class="summary" id="summary"></div>
    <div class="current-row" id="current-row"></div>
  </header>
</div>
<div id="loading">불러오는 중이에요…</div>
<div id="error" class="hidden"></div>
<div class="layout hidden" id="app">
  <aside>
    <div class="section">
      <div class="section-title">검색</div>
      <input id="search" placeholder="목표 이름 검색">
    </div>
    <div class="section">
      <div class="section-title">상태</div>
      <div id="status-filters"></div>
    </div>
    <div class="section">
      <div class="section-title">카테고리</div>
      <div id="category-filters"></div>
    </div>
  </aside>
  <div class="main">
    <div class="lane-labels-wrap">
      <div class="lane-labels" id="lane-labels"></div>
      <div class="timeline-scroll" id="timeline-scroll">
        <div class="tick-row" id="tick-row"></div>
        <div class="canvas" id="canvas"></div>
      </div>
    </div>
  </div>
</div>
<details class="hidden" id="achieved-wrap">
  <summary id="achieved-summary"></summary>
  <div class="pills" id="achieved-pills"></div>
</details>

<script>
const NODE_W = 156, NODE_H = 60, ROW_GAP = 8, LANE_PAD = 14;
const PX_PER_MONTH = 30, TIMELINE_START = 160;

const STATUS_META = {
  "시작 전": { label: "시작 전", dot: "#6b7280" },
  "진행 중": { label: "진행 중", dot: "#f5a623" },
  "달성": { label: "달성", dot: "#4fd8b0" },
};

const CATEGORY_ORDER = [
  "💪🏻 건강/피트니스", "🍀 정신/마음", "🩵 사랑/관계/가족", "🏠 라이프 스타일",
  "🪙 자산관리", "💼 일/커리어", "✍🏻 예술/창작", "✈️ 여행/모험", "__NONE__",
];

const CATEGORY_META = {
  "💪🏻 건강/피트니스": { fg: "#4fd8b0", bg: "rgba(79,216,176,0.14)", label: "건강/피트니스", emoji: "🏃" },
  "🍀 정신/마음": { fg: "#b8e05c", bg: "rgba(184,224,92,0.14)", label: "정신/마음", emoji: "🧘" },
  "🩵 사랑/관계/가족": { fg: "#ff8fb3", bg: "rgba(255,143,179,0.14)", label: "사랑/관계/가족", emoji: "💛" },
  "🏠 라이프 스타일": { fg: "#e0a458", bg: "rgba(224,164,88,0.14)", label: "라이프 스타일", emoji: "🏠" },
  "🪙 자산관리": { fg: "#f0c419", bg: "rgba(240,196,25,0.14)", label: "자산관리", emoji: "💰" },
  "💼 일/커리어": { fg: "#63b3ed", bg: "rgba(99,179,237,0.14)", label: "일/커리어", emoji: "💼" },
  "✍🏻 예술/창작": { fg: "#b794f6", bg: "rgba(183,148,246,0.14)", label: "예술/창작", emoji: "🎨" },
  "✈️ 여행/모험": { fg: "#ff8266", bg: "rgba(255,130,102,0.14)", label: "여행/모험", emoji: "✈️" },
  "__NONE__": { fg: "#9a978c", bg: "rgba(154,151,140,0.14)", label: "기타", emoji: "⭐" },
};

function esc(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function monthsIndex(dateStr) {
  if (!dateStr) return null;
  const [y, m] = dateStr.split("-").map(Number);
  return y * 12 + (m - 1);
}
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

let GRAPH = null;
let WORKER_URL = localStorage.getItem("roadmap_worker_url") || "";

function ensureWorkerUrl() {
  if (WORKER_URL) return true;
  const input = prompt("Cloudflare Worker URL을 붙여넣어 주세요 (예: https://life-roadmap-api.xxx.workers.dev)");
  if (!input) return false;
  WORKER_URL = input.replace(/\/$/, "");
  localStorage.setItem("roadmap_worker_url", WORKER_URL);
  return true;
}

document.getElementById("settings-btn").addEventListener("click", () => {
  const input = prompt("Worker URL", WORKER_URL);
  if (input === null) return;
  WORKER_URL = input.replace(/\/$/, "");
  localStorage.setItem("roadmap_worker_url", WORKER_URL);
  load();
});

async function load() {
  document.getElementById("app").classList.add("hidden");
  document.getElementById("achieved-wrap").classList.add("hidden");
  document.getElementById("error").classList.add("hidden");
  document.getElementById("loading").classList.remove("hidden");

  if (!ensureWorkerUrl()) {
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("error").textContent = "Worker URL이 필요해요. 상단의 'Worker 설정' 버튼을 눌러 입력해주세요.";
    document.getElementById("error").classList.remove("hidden");
    return;
  }

  try {
    const res = await fetch(WORKER_URL + "/goals");
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    GRAPH = data;
    renderAll();
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("achieved-wrap").classList.remove("hidden");
  } catch (err) {
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("error").textContent = "불러오지 못했어요: " + err.message;
    document.getElementById("error").classList.remove("hidden");
  }
}

function buildLayout(nodes) {
  const active = nodes.filter((n) => n.status !== "달성");
  const dated = active.filter((n) => n.targetDate);
  const monthVals = dated.map((n) => monthsIndex(n.targetDate));
  const minM = monthVals.length ? Math.min(...monthVals) - 1 : monthsIndex("2026-01-01");
  const maxM = monthVals.length ? Math.max(...monthVals) + 1 : monthsIndex("2026-12-01");
  const timelineWidth = (maxM - minM) * PX_PER_MONTH;
  const tbdX = TIMELINE_START + timelineWidth + 70;

  function xFor(n) { return n.targetDate ? TIMELINE_START + (monthsIndex(n.targetDate) - minM) * PX_PER_MONTH : tbdX; }

  const todayM = monthsIndex(todayStr());
  const todayX = TIMELINE_START + (todayM - minM) * PX_PER_MONTH;

  const byLane = new Map(CATEGORY_ORDER.map((c) => [c, []]));
  for (const n of active) {
    const primary = n.categories[0] ?? "__NONE__";
    const lane = byLane.has(primary) ? primary : "__NONE__";
    byLane.get(lane).push(n);
  }

  const lanes = [];
  let cursorY = 0;
  for (const cat of CATEGORY_ORDER) {
    const laneNodes = byLane.get(cat).slice().sort((a, b) => xFor(a) - xFor(b));
    const tracks = [];
    const placed = [];
    for (const n of laneNodes) {
      const x = xFor(n);
      let track = tracks.findIndex((end) => x > end + 10);
      if (track === -1) { track = tracks.length; tracks.push(0); }
      tracks[track] = x + NODE_W;
      const overdue = n.status === "시작 전" && n.targetDate && n.targetDate < todayStr();
      placed.push({ ...n, x, subrow: track, overdue });
    }
    if (placed.length === 0) continue;
    const laneHeight = Math.max(1, tracks.length) * (NODE_H + ROW_GAP) + LANE_PAD * 2;
    for (const p of placed) p.y = cursorY + LANE_PAD + p.subrow * (NODE_H + ROW_GAP);
    lanes.push({ cat, y: cursorY, height: laneHeight, nodes: placed });
    cursorY += laneHeight + 4;
  }

  return { lanes, totalWidth: tbdX + NODE_W + 60, totalHeight: cursorY + 20, todayX, tbdX, minM, maxM };
}

function monthTicks(minM, maxM) {
  const ticks = [];
  for (let m = minM; m <= maxM; m++) {
    const mo = (m % 12) + 1;
    if (mo === 1 || m === minM) ticks.push({ x: TIMELINE_START + (m - minM) * PX_PER_MONTH, label: String(Math.floor(m / 12)) });
  }
  return ticks;
}

function edgePathD(x1, y1, x2, y2) {
  const dx = Math.max(Math.abs(x2 - x1) / 2, 40);
  return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
}

function renderAll() {
  const { nodes, edges } = GRAPH;
  const layout = buildLayout(nodes);
  const achieved = nodes.filter((n) => n.status === "달성").sort((a, b) => (b.targetDate ?? "").localeCompare(a.targetDate ?? ""));
  const active = nodes.filter((n) => n.status !== "달성");
  const currentGoals = nodes.filter((n) => n.current);
  const nodeById = new Map();
  for (const lane of layout.lanes) for (const n of lane.nodes) nodeById.set(n.id, n);

  document.getElementById("summary").innerHTML = `
    <span>전체 <b>${nodes.length}개</b></span>
    <span>달성 <b>${achieved.length}</b></span>
    <span>진행 중 <b>${active.filter(n => n.status === "진행 중").length}</b></span>
    <span>시작 전 <b>${active.filter(n => n.status === "시작 전").length}</b></span>
  `;
  document.getElementById("current-row").innerHTML = `
    <span style="font-size:12px;color:var(--ink-soft)">요즘 목표:</span>
    ${currentGoals.map(n => `<button class="chip" data-goto="${esc(n.id)}">${esc(n.title)}</button>`).join("") || '<span style="font-size:12px;color:var(--ink-soft)">없음</span>'}
    <button id="today-btn">오늘로 이동</button>
  `;

  document.getElementById("lane-labels").style.height = layout.totalHeight + "px";
  document.getElementById("lane-labels").innerHTML = layout.lanes.map((lane) => {
    const meta = CATEGORY_META[lane.cat];
    return `<div class="lane-label" style="top:${lane.y}px;height:${lane.height}px;border-left:3px solid ${meta.fg}">
      <span style="color:${meta.fg}">${meta.emoji} ${esc(meta.label)}</span>
      <span class="lane-count">${lane.nodes.length}</span>
    </div>`;
  }).join("");

  const ticks = monthTicks(layout.minM, layout.maxM);
  document.getElementById("tick-row").style.width = layout.totalWidth + "px";
  document.getElementById("tick-row").innerHTML =
    ticks.map(t => `<div class="tick" style="left:${t.x}px">${esc(t.label)}</div>`).join("") +
    `<div class="today-label" style="left:${layout.todayX}px">오늘</div>` +
    `<div class="tbd-label" style="left:${layout.tbdX}px">날짜 미정</div>`;

  const laneBg = layout.lanes.map((lane, i) => `<div class="lane-bg" style="top:${lane.y}px;height:${lane.height}px;${i % 2 ? "background:rgba(255,255,255,0.02);" : ""}"></div>`).join("");

  const tickLines = ticks.map(t => `<line x1="${t.x}" y1="0" x2="${t.x}" y2="${layout.totalHeight}" stroke="#333846" stroke-width="1"/>`).join("");
  const todayLine = `<line x1="${layout.todayX}" y1="0" x2="${layout.todayX}" y2="${layout.totalHeight}" stroke="#ff5470" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  const tbdDivider = `<line x1="${layout.tbdX - 30}" y1="0" x2="${layout.tbdX - 30}" y2="${layout.totalHeight}" stroke="#333846" stroke-width="1" stroke-dasharray="2 4"/>`;

  const edgePaths = edges.filter(e => nodeById.has(e.source) && nodeById.has(e.target)).map((e) => {
    const s = nodeById.get(e.source), t = nodeById.get(e.target);
    const d = edgePathD(s.x + NODE_W, s.y + NODE_H / 2, t.x, t.y + NODE_H / 2);
    const dashed = e.kind === "related" ? 'stroke-dasharray="4 4"' : "";
    const marker = e.kind === "sequence" ? 'marker-end="url(#arrowhead)"' : "";
    return `<path d="${d}" fill="none" stroke="#5b6172" stroke-width="1.3" opacity="0.7" ${dashed} ${marker} data-source="${esc(e.source)}" data-target="${esc(e.target)}"/>`;
  }).join("");

  const nodeDivs = layout.lanes.flatMap(l => l.nodes).map((n) => {
    const cat = CATEGORY_META[n.categories[0] ?? "__NONE__"];
    const meta = STATUS_META[n.status];
    const emoji = n.icon || cat.emoji;
    const statusHtml = n.overdue
      ? `<div class="node-status overdue-tag"><span class="dot" style="background:${STATUS_META["시작 전"].dot}"></span>지연됨</div>`
      : `<div class="node-status"><span class="dot" style="background:${meta.dot}"></span>${meta.label}</div>`;
    return `<div class="node ${n.overdue ? "overdue" : ""}" data-id="${esc(n.id)}"
      data-status="${esc(n.status)}" data-categories="${esc(n.categories.join(","))}" data-current="${n.current ? 1 : 0}"
      data-title="${esc(n.title.toLowerCase())}"
      style="left:${n.x}px;top:${n.y}px;width:${NODE_W}px;height:${NODE_H}px;background:${cat.bg};border-color:${cat.fg};">
      ${statusHtml}
      <div class="node-title" style="color:${cat.fg}">${emoji} ${esc(n.title)}</div>
    </div>`;
  }).join("");

  document.getElementById("canvas").style.width = layout.totalWidth + "px";
  document.getElementById("canvas").style.height = layout.totalHeight + "px";
  document.getElementById("canvas").innerHTML = `
    ${laneBg}
    <svg width="${layout.totalWidth}" height="${layout.totalHeight}" style="position:absolute;left:0;top:0;pointer-events:none;">
      <defs><marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#5b6172" stroke-width="1.5"/>
      </marker></defs>
      ${tickLines}${tbdDivider}${todayLine}${edgePaths}
    </svg>
    ${nodeDivs}
  `;

  document.getElementById("achieved-summary").textContent = `달성한 목표 ${achieved.length}개 보기`;
  document.getElementById("achieved-pills").innerHTML = achieved.map((n) => {
    const cat = CATEGORY_META[n.categories[0] ?? "__NONE__"];
    return `<span class="pill" data-goto-achieved="${esc(n.id)}" style="border-color:${cat.fg};color:${cat.fg};cursor:pointer;">
      ${n.icon || cat.emoji} ${esc(n.title)} <span class="pill-date">${esc(n.targetDate ?? "")}</span>
    </span>`;
  }).join("");

  document.getElementById("status-filters").innerHTML = Object.entries(STATUS_META).map(([key, meta]) =>
    `<label class="row"><input type="checkbox" class="status-cb" value="${esc(key)}" ${key === "달성" ? "" : "checked"}><span class="dot" style="background:${meta.dot}"></span>${meta.label}</label>`
  ).join("");
  document.getElementById("category-filters").innerHTML = CATEGORY_ORDER.filter(c => layout.lanes.some(l => l.cat === c)).map((c) =>
    `<label class="row"><input type="checkbox" class="cat-cb" value="${esc(c)}" checked>${CATEGORY_META[c].emoji} ${esc(CATEGORY_META[c].label)}</label>`
  ).join("");

  wireInteractions(nodeById);
}

function wireInteractions(nodeById) {
  const search = document.getElementById("search");
  const statusCbs = Array.from(document.querySelectorAll(".status-cb"));
  const catCbs = Array.from(document.querySelectorAll(".cat-cb"));
  const nodeEls = Array.from(document.querySelectorAll(".node"));
  const edgeEls = Array.from(document.querySelectorAll("svg path[data-source]"));
  const scrollEl = document.getElementById("timeline-scroll");

  function applyFilters() {
    const q = search.value.trim().toLowerCase();
    const activeStatus = new Set(statusCbs.filter(c => c.checked).map(c => c.value));
    const activeCat = new Set(catCbs.filter(c => c.checked).map(c => c.value));
    nodeEls.forEach((n) => {
      const cats = n.dataset.categories ? n.dataset.categories.split(",") : ["__NONE__"];
      const catOk = cats.some(c => activeCat.has(c || "__NONE__"));
      const statusOk = activeStatus.has(n.dataset.status);
      const searchOk = !q || n.dataset.title.includes(q);
      n.classList.toggle("hidden", !(catOk && statusOk && searchOk));
    });
    edgeEls.forEach((e) => {
      const s = nodeEls.find(n => n.dataset.id === e.dataset.source);
      const t = nodeEls.find(n => n.dataset.id === e.dataset.target);
      e.classList.toggle("hidden", !(s && t && !s.classList.contains("hidden") && !t.classList.contains("hidden")));
    });
  }
  search.addEventListener("input", applyFilters);
  statusCbs.forEach(c => c.addEventListener("change", applyFilters));
  catCbs.forEach(c => c.addEventListener("change", applyFilters));

  function goTo(id) {
    const el = nodeEls.find(n => n.dataset.id === id);
    if (!el) return;
    const x = parseFloat(el.style.left);
    scrollEl.scrollTo({ left: Math.max(0, x - scrollEl.clientWidth / 2), behavior: "smooth" });
    el.style.outline = "2px solid #ff5470";
    setTimeout(() => el.style.outline = "", 1600);
  }
  function goToday() {
    const x = document.querySelector(".today-label");
    if (!x) return;
    scrollEl.scrollTo({ left: Math.max(0, parseFloat(x.style.left) - scrollEl.clientWidth / 2), behavior: "smooth" });
  }
  document.getElementById("today-btn").addEventListener("click", goToday);
  document.querySelectorAll("[data-goto]").forEach(btn => btn.addEventListener("click", () => goTo(btn.dataset.goto)));
  document.querySelectorAll("[data-goto-achieved]").forEach(el => el.addEventListener("click", () => {
    const n = GRAPH.nodes.find(x => x.id === el.dataset.gotoAchieved);
    if (n) openModal(n);
  }));
  nodeEls.forEach((el) => {
    el.addEventListener("click", () => {
      const n = GRAPH.nodes.find(x => x.id === el.dataset.id);
      if (n) openModal(n);
    });
  });

  setTimeout(goToday, 50);
}

function openModal(node) {
  const cat = CATEGORY_META[node.categories[0] ?? "__NONE__"];
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal">
      <h2>${node.icon || cat.emoji} ${esc(node.title)}</h2>
      <div class="meta">${esc(cat.label)} · <a class="open-link" href="${esc(node.url)}" target="_blank" rel="noopener">노션에서 열기 ↗</a></div>
      <div class="field">
        <label>상태</label>
        <select id="f-status">
          ${Object.keys(STATUS_META).map(s => `<option value="${esc(s)}" ${s === node.status ? "selected" : ""}>${esc(s)}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>목표 시기</label>
        <input type="date" id="f-date" value="${esc(node.targetDate ?? "")}">
      </div>
      <div class="field">
        <label>메모</label>
        <textarea id="f-note">${esc(node.note ?? "")}</textarea>
      </div>
      <div class="modal-msg" id="f-msg"></div>
      <div class="modal-actions">
        <button class="btn" id="f-cancel">닫기</button>
        <button class="btn primary" id="f-save">저장</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector("#f-cancel").addEventListener("click", () => overlay.remove());
  overlay.querySelector("#f-save").addEventListener("click", async () => {
    const status = overlay.querySelector("#f-status").value;
    const targetDate = overlay.querySelector("#f-date").value || null;
    const note = overlay.querySelector("#f-note").value;
    const msg = overlay.querySelector("#f-msg");
    msg.textContent = "저장 중...";
    msg.className = "modal-msg";
    try {
      const res = await fetch(WORKER_URL + "/goals/" + encodeURIComponent(node.id), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status, targetDate, note }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      msg.textContent = "저장했어요.";
      msg.className = "modal-msg ok";
      Object.assign(node, { status, targetDate, note });
      const idx = GRAPH.nodes.findIndex(n => n.id === node.id);
      if (idx !== -1) GRAPH.nodes[idx] = { ...GRAPH.nodes[idx], status, targetDate, note };
      renderAll();
      setTimeout(() => overlay.remove(), 500);
    } catch (err) {
      msg.textContent = "저장 실패: " + err.message;
      msg.className = "modal-msg err";
    }
  });
}

load();
</script>
</body>
</html>
