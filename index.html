<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인생 로드맵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#ffffff; --paper-raised:#f7f7f5; --paper-hover:#eeeeec;
    --ink:#1a1a18; --ink-soft:#6b6b66; --line:#e2e2de;
    --accent:#d6304a;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:"Inter",system-ui,sans-serif; }
  h1 { font-family:"Fraunces",serif; font-weight:500; font-size:21px; margin:0; }
  a { color: inherit; }
  #topbar { position:sticky; top:0; z-index:30; background:var(--paper); border-bottom:1px solid var(--line); }
  .banner { padding:6px 24px; font-size:11px; color:var(--ink-soft); border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; background:var(--paper-raised); }
  .banner button { font-size:11px; background:var(--paper); border:1px solid var(--line); color:var(--ink-soft); border-radius:6px; padding:2px 8px; cursor:pointer; }
  header { padding:14px 24px 12px; }
  .summary { display:flex; gap:16px; margin-top:8px; font-size:13px; color:var(--ink-soft); flex-wrap:wrap; align-items:center; }
  .summary b { color:var(--ink); font-weight:500; }
  .current-row { margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .goal-chip { font-size:12px; border:1px solid #c9820f; color:#8a5a0a; background:#fbf1de; border-radius:999px; padding:4px 10px; cursor:pointer; }
  .goal-chip:hover { background:#f5e2bd; }
  .ctrl-btn { font-size:12px; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink); border-radius:6px; padding:4px 10px; cursor:pointer; }
  .ctrl-btn:hover { background:var(--paper-hover); }
  .ctrl-btn.active { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  #right-controls { display:flex; gap:6px; margin-left:auto; }
  .layout { display:flex; }
  aside { width:190px; flex-shrink:0; border-right:1px solid var(--line); padding:16px; font-size:13px; align-self:flex-start; position:sticky; top:97px; }
  .section-title { font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-soft); margin:0 0 8px; }
  .section { margin-bottom:18px; }
  #search { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--ink); font-size:13px; }
  .filter-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .filter-chip { position:relative; display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; border:1px solid var(--line); font-size:12px; cursor:pointer; opacity:0.4; background:var(--paper); transition:opacity .15s; }
  .filter-chip:has(input:checked) { opacity:1; border-color:var(--chip-fg, var(--ink)); background:var(--chip-bg, var(--paper-raised)); color:var(--chip-fg, var(--ink)); }
  .filter-chip input { position:absolute; opacity:0; width:0; height:0; }
  .dot { width:8px; height:8px; border-radius:999px; flex-shrink:0; display:inline-block; }
  .main { flex:1; min-width:0; }
  .lane-labels-wrap { display:flex; }
  .lane-labels { width:128px; flex-shrink:0; position:relative; border-right:1px solid var(--line); }
  .lane-label { position:absolute; width:100%; display:flex; flex-direction:column; justify-content:center; padding:4px 10px; font-size:12px; font-weight:500; }
  .lane-count { font-size:10px; color:var(--ink-soft); font-weight:400; }
  .timeline-scroll { flex:1; overflow-x:auto; position:relative; }
  .tick-row { position:sticky; height:26px; background:var(--paper); border-bottom:1px solid var(--line); z-index:2; }
  .tick { position:absolute; top:5px; font-size:11px; color:var(--ink-soft); transform:translateX(2px); }
  .today-label { position:absolute; top:5px; font-size:11px; color:var(--accent); font-weight:500; transform:translateX(4px); }
  .tbd-label { position:absolute; top:5px; font-size:11px; color:var(--ink-soft); }
  .seq-label { padding:5px 10px; font-size:11px; color:var(--ink-soft); }
  .canvas { position:relative; }
  .lane-bg { position:absolute; left:0; right:0; }
  .node { position:absolute; display:flex; flex-direction:column; justify-content:center; gap:3px; border:1px solid; border-radius:8px; padding:6px 8px; cursor:pointer; overflow:hidden; background-clip:padding-box; }
  .node:hover { filter:brightness(0.97); box-shadow:0 1px 4px rgba(0,0,0,0.08); }
  .node.overdue { border-style:dashed; border-color:var(--accent) !important; }
  .node.selected { box-shadow:0 0 0 2px var(--ink); }
  .status-chip { display:inline-flex; align-items:center; gap:4px; font-size:9px; font-weight:500; border-radius:999px; padding:1px 7px; width:fit-content; }
  .status-chip.overdue-tag { background:#fdeceb; color:var(--accent); }
  .node-title { font-size:12px; font-weight:500; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .extra-cats { display:flex; gap:3px; margin-top:1px; }
  .extra-cats span { width:6px; height:6px; border-radius:999px; display:inline-block; }
  .hidden { display:none !important; }
  details { margin:20px 24px; }
  summary { cursor:pointer; font-size:13px; color:var(--ink-soft); padding:8px 0; }
  .pills { display:flex; flex-wrap:wrap; gap:6px; padding:10px 0 20px; }
  .pill { font-size:11px; border:1px solid; border-radius:999px; padding:4px 10px; background:var(--paper-raised); cursor:pointer; }
  .pill-date { opacity:0.6; margin-left:4px; }
  #loading, #error { padding:60px 24px; text-align:center; color:var(--ink-soft); }
  #error { color:var(--accent); }
  .overlay { position:fixed; inset:0; background:rgba(20,20,18,0.4); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal { width:460px; max-width:92vw; max-height:88vh; overflow-y:auto; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:20px; box-shadow:0 12px 32px rgba(0,0,0,0.14); }
  .modal-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .modal h2 { font-size:17px; margin:0 0 4px; }
  .modal .meta { font-size:12px; color:var(--ink-soft); margin-bottom:14px; }
  .nav-row { display:flex; gap:6px; flex-shrink:0; }
  .nav-row button { font-size:12px; border:1px solid var(--line); background:var(--paper-raised); border-radius:6px; padding:4px 8px; cursor:pointer; }
  .nav-row button:disabled { opacity:0.35; cursor:default; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.4px; }
  .field select, .field input, .field textarea {
    width:100%; padding:8px; border:1px solid var(--line); border-radius:6px;
    background:var(--paper); color:var(--ink); font-family:inherit; font-size:13px;
  }
  .field textarea { min-height:70px; resize:vertical; }
  .rel-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .rel-chip { display:inline-flex; align-items:center; gap:5px; font-size:12px; background:var(--paper-raised); border:1px solid var(--line); border-radius:999px; padding:3px 6px 3px 10px; }
  .rel-chip button { border:none; background:none; cursor:pointer; color:var(--ink-soft); font-size:13px; line-height:1; padding:2px; }
  .rel-add { display:flex; gap:6px; }
  .rel-add select { flex:1; }
  .rel-add button { flex-shrink:0; }
  .modal-actions { display:flex; gap:8px; justify-content:space-between; margin-top:16px; align-items:center; }
  .modal-actions-right { display:flex; gap:8px; }
  .btn { font-size:13px; padding:8px 14px; border-radius:6px; border:1px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.danger { background:#fdeceb; border-color:#f0b8b3; color:#a02a1f; }
  .btn:hover { background:var(--paper-hover); }
  .btn.primary:hover { background:#bd2740; }
  .btn.danger:hover { background:#f9d9d5; }
  .modal-msg { font-size:12px; margin-top:8px; min-height:16px; }
  .modal-msg.ok { color:#0f8f6c; }
  .modal-msg.err { color:var(--accent); }
  .open-link { font-size:12px; color:#1c6fb0; text-decoration:none; }
  .content-box { border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13px; background:var(--paper-raised); max-height:220px; overflow-y:auto; }
  .content-box p { margin:0 0 8px; }
  .content-box h3, .content-box h4, .content-box h5 { margin:10px 0 4px; font-family:inherit; }
  .content-box li { margin:2px 0; }
  .content-box hr { border:none; border-top:1px solid var(--line); margin:8px 0; }
  .content-box blockquote { margin:6px 0; padding-left:10px; border-left:2px solid var(--line); color:var(--ink-soft); }
  .content-box code { background:var(--paper-hover); padding:1px 4px; border-radius:4px; font-family:monospace; }
</style>
</head>
<body>
<div id="topbar">
  <div class="banner">
    <span>이 페이지는 열 때마다 노션에서 실시간으로 데이터를 읽어와요. 아무나 이 URL을 알면 보고 수정할 수 있어요.</span>
    <button id="settings-btn">Worker 설정</button>
  </div>
  <header>
    <h1>인생 로드맵</h1>
    <div class="summary" id="summary"></div>
    <div class="current-row" id="current-row"></div>
  </header>
</div>
<div id="loading">불러오는 중이에요…</div>
<div id="error" class="hidden"></div>
<div class="layout hidden" id="app">
  <aside>
    <div class="section">
      <div class="section-title">검색</div>
      <input id="search" placeholder="목표 이름 검색">
    </div>
    <div class="section">
      <div class="section-title">상태</div>
      <div class="filter-chips" id="status-filters"></div>
    </div>
    <div class="section">
      <div class="section-title">카테고리</div>
      <div class="filter-chips" id="category-filters"></div>
    </div>
  </aside>
  <div class="main">
    <div class="lane-labels-wrap">
      <div class="lane-labels" id="lane-labels"></div>
      <div class="timeline-scroll" id="timeline-scroll">
        <div class="tick-row" id="tick-row"></div>
        <div class="canvas" id="canvas"></div>
      </div>
    </div>
  </div>
</div>
<details class="hidden" id="achieved-wrap">
  <summary id="achieved-summary"></summary>
  <div class="pills" id="achieved-pills"></div>
</details>

<script>
const NODE_W = 156, NODE_H = 64, ROW_GAP = 8, LANE_PAD = 14;
const PX_PER_MONTH = 30, TIMELINE_START = 160, SEQ_STEP = NODE_W + 40;

const STATUS_META = {
  "시작 전": { label: "시작 전", fg: "#6b6b66", bg: "#f1f1ee" },
  "진행 중": { label: "진행 중", fg: "#a3630a", bg: "#fdf1de" },
  "달성": { label: "달성", fg: "#0f8f6c", bg: "#e6f7f1" },
};

const CATEGORY_ORDER = [
  "💪🏻 건강/피트니스", "🍀 정신/마음", "🩵 사랑/관계/가족", "🏠 라이프 스타일",
  "🪙 자산관리", "💼 일/커리어", "✍🏻 예술/창작", "✈️ 여행/모험", "__NONE__",
];

const CATEGORY_META = {
  "💪🏻 건강/피트니스": { fg: "#0f8f6c", bg: "#e6f7f1", bg2: "#c3ecdc", label: "건강/피트니스", emoji: "🏃" },
  "🍀 정신/마음": { fg: "#6b8f1f", bg: "#f2f7e2", bg2: "#dcecc0", label: "정신/마음", emoji: "🧘" },
  "🩵 사랑/관계/가족": { fg: "#c23d68", bg: "#fdeef3", bg2: "#f8d3e0", label: "사랑/관계/가족", emoji: "💛" },
  "🏠 라이프 스타일": { fg: "#a8681c", bg: "#faf1e2", bg2: "#f2ddb9", label: "라이프 스타일", emoji: "🏠" },
  "🪙 자산관리": { fg: "#a8830a", bg: "#fbf5dc", bg2: "#f5e8ad", label: "자산관리", emoji: "💰" },
  "💼 일/커리어": { fg: "#1c6fb0", bg: "#e8f2fb", bg2: "#cce3f7", label: "일/커리어", emoji: "💼" },
  "✍🏻 예술/창작": { fg: "#7a4fc9", bg: "#f2ecfc", bg2: "#e0d0f7", label: "예술/창작", emoji: "🎨" },
  "✈️ 여행/모험": { fg: "#c14a2c", bg: "#fbeae4", bg2: "#f7d2c2", label: "여행/모험", emoji: "✈️" },
  "__NONE__": { fg: "#6b6b66", bg: "#f1f1ee", bg2: "#dedcd5", label: "기타", emoji: "⭐" },
};

function esc(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function monthsIndex(dateStr) {
  if (!dateStr) return null;
  const [y, m] = dateStr.split("-").map(Number);
  return y * 12 + (m - 1);
}
function todayStr() { return new Date().toISOString().slice(0, 10); }

let GRAPH = null;
let VIEW_MODE = "time";
let FULL_ORDER = [];
let WORKER_URL = localStorage.getItem("roadmap_worker_url") || "";

function ensureWorkerUrl() {
  if (WORKER_URL) return true;
  const input = prompt("Cloudflare Worker URL을 붙여넣어 주세요 (예: https://life-roadmap-api.xxx.workers.dev)");
  if (!input) return false;
  WORKER_URL = input.replace(/\/$/, "");
  localStorage.setItem("roadmap_worker_url", WORKER_URL);
  return true;
}

document.getElementById("settings-btn").addEventListener("click", () => {
  const input = prompt("Worker URL", WORKER_URL);
  if (input === null) return;
  WORKER_URL = input.replace(/\/$/, "");
  localStorage.setItem("roadmap_worker_url", WORKER_URL);
  load();
});

async function load() {
  document.getElementById("app").classList.add("hidden");
  document.getElementById("achieved-wrap").classList.add("hidden");
  document.getElementById("error").classList.add("hidden");
  document.getElementById("loading").classList.remove("hidden");

  if (!ensureWorkerUrl()) {
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("error").textContent = "Worker URL이 필요해요. 상단의 'Worker 설정' 버튼을 눌러 입력해주세요.";
    document.getElementById("error").classList.remove("hidden");
    return;
  }

  try {
    const res = await fetch(WORKER_URL + "/goals");
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    GRAPH = data;
    renderStatic();
    rerenderCanvas();
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("achieved-wrap").classList.remove("hidden");
  } catch (err) {
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("error").textContent = "불러오지 못했어요: " + err.message;
    document.getElementById("error").classList.remove("hidden");
  }
}

function buildLayout(nodes, mode) {
  let xFor, tbdX, todayX, minM, maxM, hasTimeAxis;

  if (mode === "sequence") {
    hasTimeAxis = false;
    const dated = nodes.filter(n => n.targetDate).sort((a, b) => a.targetDate.localeCompare(b.targetDate));
    const undated = nodes.filter(n => !n.targetDate).sort((a, b) => a.title.localeCompare(b.title, "ko"));
    const combined = [...dated, ...undated];
    const rank = new Map(combined.map((n, i) => [n.id, i]));
    xFor = (n) => TIMELINE_START + rank.get(n.id) * SEQ_STEP;
    tbdX = null; todayX = null; minM = null; maxM = null;
  } else {
    hasTimeAxis = true;
    const dated = nodes.filter(n => n.targetDate);
    const monthVals = dated.map(n => monthsIndex(n.targetDate));
    minM = monthVals.length ? Math.min(...monthVals) - 1 : monthsIndex("2026-01-01");
    maxM = monthVals.length ? Math.max(...monthVals) + 1 : monthsIndex("2026-12-01");
    tbdX = TIMELINE_START + (maxM - minM) * PX_PER_MONTH + 70;
    xFor = (n) => n.targetDate ? TIMELINE_START + (monthsIndex(n.targetDate) - minM) * PX_PER_MONTH : tbdX;
    const todayM = monthsIndex(todayStr());
    todayX = TIMELINE_START + (todayM - minM) * PX_PER_MONTH;
  }

  const byLane = new Map(CATEGORY_ORDER.map(c => [c, []]));
  for (const n of nodes) {
    const primary = n.categories[0] ?? "__NONE__";
    const lane = byLane.has(primary) ? primary : "__NONE__";
    byLane.get(lane).push(n);
  }

  const lanes = [];
  let cursorY = 0;
  for (const cat of CATEGORY_ORDER) {
    const laneNodes = byLane.get(cat).slice().sort((a, b) => xFor(a) - xFor(b));
    const tracks = [];
    const placed = [];
    for (const n of laneNodes) {
      const x = xFor(n);
      let track = tracks.findIndex(end => x > end + 10);
      if (track === -1) { track = tracks.length; tracks.push(0); }
      tracks[track] = x + NODE_W;
      const overdue = n.status === "시작 전" && n.targetDate && n.targetDate < todayStr();
      placed.push({ ...n, x, subrow: track, overdue });
    }
    if (placed.length === 0) continue;
    const laneHeight = Math.max(1, tracks.length) * (NODE_H + ROW_GAP) + LANE_PAD * 2;
    for (const p of placed) p.y = cursorY + LANE_PAD + p.subrow * (NODE_H + ROW_GAP);
    lanes.push({ cat, y: cursorY, height: laneHeight, nodes: placed });
    cursorY += laneHeight + 4;
  }

  let totalWidth;
  if (mode === "sequence") {
    const maxX = Math.max(TIMELINE_START, ...lanes.flatMap(l => l.nodes.map(n => n.x)));
    totalWidth = maxX + NODE_W + 60;
  } else {
    totalWidth = tbdX + NODE_W + 60;
  }

  return { lanes, totalWidth, totalHeight: cursorY + 20, todayX, tbdX, minM, maxM, hasTimeAxis };
}

function monthTicks(minM, maxM) {
  const ticks = [];
  for (let m = minM; m <= maxM; m++) {
    const mo = (m % 12) + 1;
    if (mo === 1 || m === minM) ticks.push({ x: TIMELINE_START + (m - minM) * PX_PER_MONTH, label: String(Math.floor(m / 12)) });
  }
  return ticks;
}

function edgePathD(x1, y1, x2, y2) {
  const dx = Math.max(Math.abs(x2 - x1) / 2, 40);
  return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
}

function getFilterState() {
  const search = document.getElementById("search");
  const statusCbs = Array.from(document.querySelectorAll(".status-cb"));
  const catCbs = Array.from(document.querySelectorAll(".cat-cb"));
  return {
    q: search ? search.value.trim().toLowerCase() : "",
    statuses: new Set(statusCbs.filter(c => c.checked).map(c => c.value)),
    categories: new Set(catCbs.filter(c => c.checked).map(c => c.value)),
  };
}

function passesFilter(n, f) {
  const cats = n.categories.length ? n.categories : ["__NONE__"];
  const catOk = cats.some(c => f.categories.has(c));
  const statusOk = f.statuses.has(n.status);
  const searchOk = !f.q || n.title.toLowerCase().includes(f.q);
  return catOk && statusOk && searchOk;
}

function renderStatic() {
  const nodes = GRAPH.nodes;
  const achieved = nodes.filter(n => n.status === "달성").sort((a, b) => (b.targetDate ?? "").localeCompare(a.targetDate ?? ""));
  const active = nodes.filter(n => n.status !== "달성");
  const currentGoals = nodes.filter(n => n.current);

  document.getElementById("summary").innerHTML = `
    <span>전체 <b>${nodes.length}개</b></span>
    <span>달성 <b>${achieved.length}</b></span>
    <span>진행 중 <b>${active.filter(n => n.status === "진행 중").length}</b></span>
    <span>시작 전 <b>${active.filter(n => n.status === "시작 전").length}</b></span>
  `;
  document.getElementById("current-row").innerHTML = `
    <span style="font-size:12px;color:var(--ink-soft)">요즘 목표:</span>
    ${currentGoals.map(n => `<button class="goal-chip" data-goto="${esc(n.id)}">${esc(n.title)}</button>`).join("") || '<span style="font-size:12px;color:var(--ink-soft)">없음</span>'}
    <div id="right-controls">
      <button class="ctrl-btn" id="mode-btn"></button>
      <button class="ctrl-btn" id="today-btn">오늘로 이동</button>
    </div>
  `;

  document.getElementById("achieved-summary").textContent = `달성한 목표 ${achieved.length}개 보기`;
  document.getElementById("achieved-pills").innerHTML = achieved.map((n) => {
    const cat = CATEGORY_META[n.categories[0] ?? "__NONE__"];
    return `<span class="pill" data-goto-achieved="${esc(n.id)}" style="border-color:${cat.fg};color:${cat.fg}">
      ${n.icon || cat.emoji} ${esc(n.title)} <span class="pill-date">${esc(n.targetDate ?? "")}</span>
    </span>`;
  }).join("");

  const presentCats = CATEGORY_ORDER.filter(c => active.some(n => (n.categories[0] ?? "__NONE__") === c));
  document.getElementById("status-filters").innerHTML = Object.entries(STATUS_META).filter(([k]) => k !== "달성").map(([key, meta]) =>
    `<label class="filter-chip" style="--chip-fg:${meta.fg};--chip-bg:${meta.bg}"><input type="checkbox" class="status-cb" value="${esc(key)}" checked><span class="dot" style="background:${meta.fg}"></span>${meta.label}</label>`
  ).join("");
  document.getElementById("category-filters").innerHTML = presentCats.map((c) => {
    const meta = CATEGORY_META[c];
    return `<label class="filter-chip" style="--chip-fg:${meta.fg};--chip-bg:${meta.bg}"><input type="checkbox" class="cat-cb" value="${esc(c)}" checked>${meta.emoji} ${esc(meta.label)}</label>`;
  }).join("");

  document.querySelectorAll(".status-cb, .cat-cb").forEach(cb => cb.addEventListener("change", () => rerenderCanvas()));
  document.getElementById("search").addEventListener("input", () => rerenderCanvas());
  document.getElementById("mode-btn").addEventListener("click", () => {
    VIEW_MODE = VIEW_MODE === "time" ? "sequence" : "time";
    rerenderCanvas();
  });

  document.querySelectorAll("[data-goto]").forEach(btn => btn.addEventListener("click", () => goTo(btn.dataset.goto)));
  document.querySelectorAll("[data-goto-achieved]").forEach(el => el.addEventListener("click", () => {
    const n = GRAPH.nodes.find(x => x.id === el.dataset.gotoAchieved);
    if (n) openModal(n);
  }));
}

function rerenderCanvas() {
  const f = getFilterState();
  const activeAll = GRAPH.nodes.filter(n => n.status !== "달성");
  const filtered = activeAll.filter(n => passesFilter(n, f));
  const layout = buildLayout(filtered, VIEW_MODE);
  const nodeById = new Map();
  for (const lane of layout.lanes) for (const n of lane.nodes) nodeById.set(n.id, n);

  const fullLayout = buildLayout(activeAll, VIEW_MODE);
  FULL_ORDER = fullLayout.lanes.flatMap(l => l.nodes.map(n => n.id));

  const modeBtn = document.getElementById("mode-btn");
  if (modeBtn) modeBtn.textContent = VIEW_MODE === "time" ? "순서대로 보기" : "시간순 보기";

  document.getElementById("lane-labels").style.height = layout.totalHeight + "px";
  document.getElementById("lane-labels").innerHTML = layout.lanes.map((lane) => {
    const meta = CATEGORY_META[lane.cat];
    return `<div class="lane-label" style="top:${lane.y}px;height:${lane.height}px;border-left:3px solid ${meta.fg}">
      <span style="color:${meta.fg}">${meta.emoji} ${esc(meta.label)}</span>
      <span class="lane-count">${lane.nodes.length}</span>
    </div>`;
  }).join("");

  const tickRow = document.getElementById("tick-row");
  if (layout.hasTimeAxis) {
    const ticks = monthTicks(layout.minM, layout.maxM);
    tickRow.style.width = layout.totalWidth + "px";
    tickRow.innerHTML =
      ticks.map(t => `<div class="tick" style="left:${t.x}px">${esc(t.label)}</div>`).join("") +
      `<div class="today-label" style="left:${layout.todayX}px">오늘</div>` +
      `<div class="tbd-label" style="left:${layout.tbdX}px">날짜 미정</div>`;
  } else {
    tickRow.style.width = layout.totalWidth + "px";
    tickRow.innerHTML = `<div class="seq-label">시간축 없이 순서대로 표시 중</div>`;
  }

  const laneBg = layout.lanes.map((lane, i) => `<div class="lane-bg" style="top:${lane.y}px;height:${lane.height}px;${i % 2 ? "background:rgba(0,0,0,0.015);" : ""}"></div>`).join("");
  const tickLines = layout.hasTimeAxis ? monthTicks(layout.minM, layout.maxM).map(t => `<line x1="${t.x}" y1="0" x2="${t.x}" y2="${layout.totalHeight}" stroke="#e2e2de" stroke-width="1"/>`).join("") : "";
  const todayLine = layout.hasTimeAxis ? `<line x1="${layout.todayX}" y1="0" x2="${layout.todayX}" y2="${layout.totalHeight}" stroke="#d6304a" stroke-width="1.5" stroke-dasharray="3 3"/>` : "";
  const tbdDivider = layout.hasTimeAxis ? `<line x1="${layout.tbdX - 30}" y1="0" x2="${layout.tbdX - 30}" y2="${layout.totalHeight}" stroke="#e2e2de" stroke-width="1" stroke-dasharray="2 4"/>` : "";

  const edgePaths = GRAPH.edges.filter(e => nodeById.has(e.source) && nodeById.has(e.target)).map((e) => {
    const s = nodeById.get(e.source), t = nodeById.get(e.target);
    const d = edgePathD(s.x + NODE_W, s.y + NODE_H / 2, t.x, t.y + NODE_H / 2);
    const dashed = e.kind === "related" ? 'stroke-dasharray="4 4"' : "";
    const marker = e.kind === "sequence" ? 'marker-end="url(#arrowhead)"' : "";
    return `<path d="${d}" fill="none" stroke="#b7b7ae" stroke-width="1.3" opacity="0.8" ${dashed} ${marker} data-source="${esc(e.source)}" data-target="${esc(e.target)}"/>`;
  }).join("");

  const nodeDivs = layout.lanes.flatMap(l => l.nodes).map((n) => {
    const cat = CATEGORY_META[n.categories[0] ?? "__NONE__"];
    const meta = STATUS_META[n.status];
    const emoji = n.icon || cat.emoji;
    const bg = n.status === "진행 중" ? cat.bg2 : cat.bg;
    const extraCats = n.categories.slice(1);
    const statusHtml = n.overdue
      ? `<span class="status-chip overdue-tag">지연됨</span>`
      : `<span class="status-chip" style="background:${meta.bg};color:${meta.fg}">${meta.label}</span>`;
    const extraDots = extraCats.length
      ? `<div class="extra-cats">${extraCats.map(c => `<span style="background:${(CATEGORY_META[c]||CATEGORY_META.__NONE__).fg}"></span>`).join("")}</div>` : "";
    const titleAttr = n.categories.length > 1 ? ` title="카테고리: ${esc(n.categories.map(c => CATEGORY_META[c]?.label ?? c).join(', '))}"` : "";
    return `<div class="node ${n.overdue ? "overdue" : ""}" data-id="${esc(n.id)}"${titleAttr}
      style="left:${n.x}px;top:${n.y}px;width:${NODE_W}px;height:${NODE_H}px;background:${bg};border-color:${cat.fg};">
      ${statusHtml}
      <div class="node-title" style="color:${cat.fg}">${emoji} ${esc(n.title)}</div>
      ${extraDots}
    </div>`;
  }).join("");

  document.getElementById("canvas").style.width = layout.totalWidth + "px";
  document.getElementById("canvas").style.height = layout.totalHeight + "px";
  document.getElementById("canvas").innerHTML = `
    ${laneBg}
    <svg width="${layout.totalWidth}" height="${layout.totalHeight}" style="position:absolute;left:0;top:0;pointer-events:none;">
      <defs><marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#b7b7ae" stroke-width="1.5"/>
      </marker></defs>
      ${tickLines}${tbdDivider}${todayLine}${edgePaths}
    </svg>
    ${nodeDivs}
  `;

  wireCanvasInteractions();
  syncTickRowTop();
}

function syncTickRowTop() {
  const tb = document.getElementById("topbar");
  const tickRow = document.getElementById("tick-row");
  if (tb && tickRow) tickRow.style.top = tb.offsetHeight + "px";
}
window.addEventListener("resize", syncTickRowTop);

function wireCanvasInteractions() {
  const nodeEls = Array.from(document.querySelectorAll(".node"));
  nodeEls.forEach((el) => {
    el.addEventListener("click", () => {
      nodeEls.forEach(x => x.classList.remove("selected"));
      el.classList.add("selected");
    });
    el.addEventListener("dblclick", () => {
      const n = GRAPH.nodes.find(x => x.id === el.dataset.id);
      if (n) openModal(n);
    });
  });

  document.getElementById("today-btn").addEventListener("click", goToday);
}

function goToday() {
  const x = document.querySelector(".today-label");
  const scrollEl = document.getElementById("timeline-scroll");
  if (!x) return;
  scrollEl.scrollTo({ left: Math.max(0, parseFloat(x.style.left) - scrollEl.clientWidth / 2), behavior: "smooth" });
}

function goTo(id) {
  const el = document.querySelector(`.node[data-id="${CSS.escape(id)}"]`);
  if (!el) {
    const n = GRAPH.nodes.find(x => x.id === id);
    if (n) openModal(n);
    return;
  }
  el.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
  el.classList.add("selected");
  setTimeout(() => el.classList.remove("selected"), 1600);
}

function relationOptionsHtml(excludeId, alreadyIds) {
  const taken = new Set(alreadyIds);
  return GRAPH.nodes
    .filter(n => n.id !== excludeId && !taken.has(n.id))
    .sort((a, b) => a.title.localeCompare(b.title, "ko"))
    .map(n => `<option value="${esc(n.id)}">${esc(n.title)}</option>`)
    .join("");
}

function relationChipsHtml(ids, fieldName) {
  return ids.map((id) => {
    const n = GRAPH.nodes.find(x => x.id === id);
    const title = n ? n.title : "(알 수 없음)";
    return `<span class="rel-chip" data-rel-id="${esc(id)}">${esc(title)}<button type="button" class="rel-remove" data-field="${fieldName}" data-id="${esc(id)}">✕</button></span>`;
  }).join("") || '<span style="font-size:12px;color:var(--ink-soft)">없음</span>';
}

function renderBlocksHtml(blocks) {
  if (!blocks.length) return '<span style="color:var(--ink-soft)">내용이 없어요.</span>';
  let html = "";
  let listOpen = null;
  function closeList() { if (listOpen) { html += `</${listOpen}>`; listOpen = null; } }
  for (const b of blocks) {
    if (b.type === "bulleted_list_item") {
      if (listOpen !== "ul") { closeList(); html += "<ul>"; listOpen = "ul"; }
      html += `<li>${esc(b.text)}</li>`;
      continue;
    }
    if (b.type === "numbered_list_item") {
      if (listOpen !== "ol") { closeList(); html += "<ol>"; listOpen = "ol"; }
      html += `<li>${esc(b.text)}</li>`;
      continue;
    }
    closeList();
    if (b.type === "heading_1") html += `<h3>${esc(b.text)}</h3>`;
    else if (b.type === "heading_2") html += `<h4>${esc(b.text)}</h4>`;
    else if (b.type === "heading_3") html += `<h5>${esc(b.text)}</h5>`;
    else if (b.type === "divider") html += `<hr>`;
    else if (b.type === "quote") html += `<blockquote>${esc(b.text)}</blockquote>`;
    else if (b.type === "to_do") html += `<div>${b.checked ? "☑" : "☐"} ${esc(b.text)}</div>`;
    else if (b.type === "code") html += `<pre><code>${esc(b.text)}</code></pre>`;
    else if (b.type === "image") html += `<div><em>[이미지: ${esc(b.text)}]</em></div>`;
    else if (b.text) html += `<p>${esc(b.text)}</p>`;
  }
  closeList();
  return html;
}

function openModal(node) {
  const cat = CATEGORY_META[node.categories[0] ?? "__NONE__"];
  let predecessors = [...(node.predecessors || [])];
  let successors = [...(node.successors || [])];
  const navIdx = FULL_ORDER.indexOf(node.id);

  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-top">
        <div>
          <h2>${node.icon || cat.emoji} ${esc(node.title)}</h2>
          <div class="meta">${esc(cat.label)} · <a class="open-link" href="${esc(node.url)}" target="_blank" rel="noopener">노션에서 열기 ↗</a></div>
        </div>
        <div class="nav-row">
          <button id="nav-prev" ${navIdx <= 0 ? "disabled" : ""}>◀ 이전</button>
          <button id="nav-next" ${navIdx === -1 || navIdx >= FULL_ORDER.length - 1 ? "disabled" : ""}>다음 ▶</button>
        </div>
      </div>
      <div class="field">
        <label>상태</label>
        <select id="f-status">
          ${Object.keys(STATUS_META).map(s => `<option value="${esc(s)}" ${s === node.status ? "selected" : ""}>${esc(s)}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>목표 시기</label>
        <input type="date" id="f-date" value="${esc(node.targetDate ?? "")}">
      </div>
      <div class="field">
        <label>메모</label>
        <textarea id="f-note">${esc(node.note ?? "")}</textarea>
      </div>
      <div class="field">
        <label>선행 목표</label>
        <div class="rel-chips" id="pred-chips">${relationChipsHtml(predecessors, "predecessors")}</div>
        <div class="rel-add">
          <select id="pred-select"><option value="">추가할 목표 선택…</option>${relationOptionsHtml(node.id, predecessors)}</select>
          <button type="button" class="btn" id="pred-add">추가</button>
        </div>
      </div>
      <div class="field">
        <label>후속 목표</label>
        <div class="rel-chips" id="succ-chips">${relationChipsHtml(successors, "successors")}</div>
        <div class="rel-add">
          <select id="succ-select"><option value="">추가할 목표 선택…</option>${relationOptionsHtml(node.id, successors)}</select>
          <button type="button" class="btn" id="succ-add">추가</button>
        </div>
      </div>
      <div class="field">
        <label>페이지 내용</label>
        <div class="content-box" id="page-content">불러오는 중…</div>
      </div>
      <div class="modal-msg" id="f-msg"></div>
      <div class="modal-actions">
        <button class="btn danger" id="f-delete">삭제</button>
        <div class="modal-actions-right">
          <button class="btn" id="f-cancel">닫기</button>
          <button class="btn primary" id="f-save">저장</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  fetch(WORKER_URL + "/goals/" + encodeURIComponent(node.id) + "/content")
    .then(r => r.json())
    .then(data => {
      const box = overlay.querySelector("#page-content");
      if (data.error) { box.textContent = "내용을 불러오지 못했어요."; return; }
      box.innerHTML = renderBlocksHtml(data.blocks || []);
    })
    .catch(() => { overlay.querySelector("#page-content").textContent = "내용을 불러오지 못했어요."; });

  function refreshRelChips() {
    overlay.querySelector("#pred-chips").innerHTML = relationChipsHtml(predecessors, "predecessors");
    overlay.querySelector("#succ-chips").innerHTML = relationChipsHtml(successors, "successors");
    overlay.querySelector("#pred-select").innerHTML = '<option value="">추가할 목표 선택…</option>' + relationOptionsHtml(node.id, predecessors);
    overlay.querySelector("#succ-select").innerHTML = '<option value="">추가할 목표 선택…</option>' + relationOptionsHtml(node.id, successors);
    overlay.querySelectorAll(".rel-remove").forEach(btn => btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      if (btn.dataset.field === "predecessors") predecessors = predecessors.filter(x => x !== id);
      else successors = successors.filter(x => x !== id);
      refreshRelChips();
    }));
  }
  refreshRelChips();

  overlay.querySelector("#pred-add").addEventListener("click", () => {
    const sel = overlay.querySelector("#pred-select");
    if (sel.value) { predecessors.push(sel.value); refreshRelChips(); }
  });
  overlay.querySelector("#succ-add").addEventListener("click", () => {
    const sel = overlay.querySelector("#succ-select");
    if (sel.value) { successors.push(sel.value); refreshRelChips(); }
  });

  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector("#f-cancel").addEventListener("click", () => overlay.remove());

  function goNav(delta) {
    const newIdx = navIdx + delta;
    if (newIdx < 0 || newIdx >= FULL_ORDER.length) return;
    const n = GRAPH.nodes.find(x => x.id === FULL_ORDER[newIdx]);
    overlay.remove();
    if (n) openModal(n);
  }
  overlay.querySelector("#nav-prev").addEventListener("click", () => goNav(-1));
  overlay.querySelector("#nav-next").addEventListener("click", () => goNav(1));

  overlay.querySelector("#f-delete").addEventListener("click", async () => {
    if (!confirm(`"${node.title}"을(를) 삭제할까요? (노션에서 휴지통으로 이동돼요, 복구 가능)`)) return;
    const msg = overlay.querySelector("#f-msg");
    msg.textContent = "삭제 중...";
    msg.className = "modal-msg";
    try {
      const res = await fetch(WORKER_URL + "/goals/" + encodeURIComponent(node.id), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ archived: true }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      overlay.remove();
      load();
    } catch (err) {
      msg.textContent = "삭제 실패: " + err.message;
      msg.className = "modal-msg err";
    }
  });

  overlay.querySelector("#f-save").addEventListener("click", async () => {
    const status = overlay.querySelector("#f-status").value;
    const targetDate = overlay.querySelector("#f-date").value || null;
    const note = overlay.querySelector("#f-note").value;
    const msg = overlay.querySelector("#f-msg");
    msg.textContent = "저장 중...";
    msg.className = "modal-msg";
    try {
      const res = await fetch(WORKER_URL + "/goals/" + encodeURIComponent(node.id), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status, targetDate, note, predecessors, successors }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      msg.textContent = "저장했어요.";
      msg.className = "modal-msg ok";
      setTimeout(() => { overlay.remove(); load(); }, 400);
    } catch (err) {
      msg.textContent = "저장 실패: " + err.message;
      msg.className = "modal-msg err";
    }
  });
}

load();
</script>
</body>
</html>
